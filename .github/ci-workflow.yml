# NOT ACTIVE AT THIS PATH.
#
# GitHub refuses a push that creates or edits a file under .github/workflows/
# unless the credential carries the `workflow` scope, so this file is parked
# here instead. To activate it, either:
#
#   1. Add the `workflow` scope to the token at
#      https://github.com/settings/tokens, then locally:
#        git mv .github/ci-workflow.yml .github/workflows/ci.yml
#        git commit -am "Activate CI workflow" && git push
#
#   2. Or, in the GitHub web editor (which does not need the scope), use
#      "Add file > Create new file", name it .github/workflows/ci.yml, paste
#      the contents below, and delete this file.
#
# Remove this comment block along with the move.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck --severity=style install.sh uninstall.sh tools/install-filter-service.sh tools/focus-follows-mouse/toggle.sh tools/lib/omatoys-common.sh
      - name: Check bash syntax
        run: |
          for script in install.sh uninstall.sh tools/install-filter-service.sh tools/focus-follows-mouse/toggle.sh tools/lib/omatoys-common.sh; do
            bash -n "$script"
          done

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
          python -m pip install --upgrade pip
          python -m pip install ruff evdev
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: python -m unittest discover -s tests -v

  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest.json and referenced entry points
        run: python3 .github/scripts/check-manifest.py
